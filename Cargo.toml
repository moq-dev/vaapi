[package]
name = "moq-vaapi"
version = "0.1.1"
description = "(AI GENERATED) VA-API H.264/H.265 hardware encoder and decoder, derived from discord/cros-libva + discord/cros-codecs"
authors = ["The ChromiumOS Authors", "Discord", "Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/vaapi"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["vaapi", "h264", "encoder", "decoder", "hardware"]
categories = ["multimedia::encoding", "hardware-support", "external-ffi-bindings"]
edition = "2021"
rust-version = "1.85"

# Dev-only tooling and the headers `just bindgen` reads; not needed to build the
# crate from the published tarball.
exclude = [
    "flake.nix",
    "flake.lock",
    "justfile",
    "deny.toml",
    "rust-toolchain.toml",
    ".rustfmt.toml",
    "libva/",
    "libva-wrapper.h",
]

# The libva bindings are generated from the vendored headers in `libva/` (pinned
# to a known VA-API version, so a system libva bump can't drift them) by `just
# bindgen`, and checked in: the build needs no libclang, no libva, and no build
# script. libva is not linked either: the bindings' `Va` struct dlopen's it at
# runtime, so the binary carries no NEEDED libva (a libva-less host loads and
# lets the caller fall back), and the crate builds on any OS (macOS, docs.rs).

[dependencies]
anyhow = "1"
thiserror = "1"
bitflags = "2.5"
log = "0"
# Runtime dlopen of libva; the bindgen `Va` struct is built on libloading::Library.
libloading = "0.8"
