[package]
name = "moq-vaapi"
version = "0.0.2"
description = "(AI GENERATED) VA-API H.264 hardware encoder, derived from discord/cros-libva + discord/cros-codecs"
authors = ["The ChromiumOS Authors", "Discord", "Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/vaapi"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["vaapi", "h264", "encoder", "video", "hardware"]
categories = ["multimedia::encoding", "hardware-support", "external-ffi-bindings"]
edition = "2021"
rust-version = "1.85"

# Dev-only tooling; not needed to build the crate from the published tarball.
exclude = ["flake.nix", "flake.lock", "justfile", "deny.toml", "rust-toolchain.toml", ".rustfmt.toml"]

# bindgen reads the vendored libva headers checked into `libva/` (refreshed by
# `just vendor`, pinned to a known VA-API version so a system libva bump can't
# drift the bindings). libva is not linked: bindgen's dynamic-loading mode emits a
# `Va` struct that dlopen's libva.so at runtime (see bindgen_gen.rs), so the build
# needs only libclang + the vendored headers, the binary carries no NEEDED libva
# (a libva-less host loads and lets the caller fall back), and the crate builds on
# any OS (macOS, docs.rs) without libva installed.

[dependencies]
anyhow = "1"
thiserror = "1"
bitflags = "2.5"
log = { version = "0", features = ["release_max_level_debug"] }
# Runtime dlopen of libva; the bindgen `Va` struct is built on libloading::Library.
libloading = "0.8"

[build-dependencies]
bindgen = "0.70.1"
regex = "1.11.1"
